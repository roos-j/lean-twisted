version: "v0.4"

project:
  name: Boundedness of higher-dimensional twisted paraproducts
  description: >-
    This is a formalization of Lebesgue space bounds for higher-dimensional twisted paraproducts in the full open Banach range. This was an open problem in every dimension d >= 2. For d = 2, Kovac (Rev. Mat. Iberoam. 2012, Theorem 1) proved bounds for input exponents 1 < p_1, p_2 < infinity with 1/p_1 + 1/p_2 > 1/2, i.e. target exponents p < 2. For d = 3, Durcik and Roos (Proc. AMS 2021, Sections 1 and 3) proved bounds for 1 < p < 4/3 and 1 < p_i < 4. For d >= 4, no bounds were known for any exponents, as stated in Durcik-Roos (2021, Section 1). The proof and the formalization blueprint were generated with GPT-6.2 Astra Ultra. The formalization was done with GPT-6.2 Sol Light.
  authors:
    - Polona Durcik
    - Joris Roos
  license: Apache-2.0
  responsible_maintainers:
    - Joris Roos

classification:
  arxiv:
    - math.CA
  msc2020:
    - 42B15
    - 42B20

sources:
  - title: "Boundedness of higher-dimensional twisted paraproducts: a formalization blueprint"
    type: blueprint
    location: tp_blueprint.tex (in this repository)
    relationship: formalizes
    note: >-
      The proof was generated by GPT-6.2 Astra Ultra, which also produced this
      formalization blueprint. The formalized result is Theorem bp:main of the
      blueprint.
  - title: On the two-dimensional bilinear Hilbert transform
    authors:
      - Ciprian Demeter
      - Christoph Thiele
    id: doi:10.1353/ajm.0.0101
    type: article
    location: Amer. J. Math. 132 (2010), no. 1, 201-256
    relationship: background
  - title: Averages of simplex Hilbert transforms
    authors:
      - Polona Durcik
      - Joris Roos
    id: arXiv:1812.11701
    type: article
    location: Proc. Amer. Math. Soc. 149 (2021), no. 2, 633-647
    relationship: background
    note: >-
      Section 1 records Kovac's d = 2 result for general smooth symbols (dual exponent
      p_0 in (2, infinity)), proves the d = 3 bound for p_0 in (4, infinity) and p_1, p_2,
      p_3 in (1, 4) (Sections 1 and 3), and states that the estimate is not known for any
      n >= 4 for any tuple of exponents.
  - title: Boundedness of the twisted paraproduct
    authors:
      - Vjekoslav Kovač
    type: article
    id: arXiv:1011.6140
    location: Rev. Mat. Iberoam. 28 (2012), no. 4, 1143-1164
    relationship: background
    note: >-
      Theorem 1 proves the d = 2 bound for 1 < p_1, p_2 < infinity with
      1/p_1 + 1/p_2 > 1/2, i.e. target exponent p < 2; the part p >= 2 is not treated.

