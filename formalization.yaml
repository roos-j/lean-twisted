fidelity:
  divergences: >-
    The blueprint's Theorem bp:main asserts the multiplier bound with some
    smoothness order s; the Lean statement fixes s = 5d + 2. The Mikhlin condition
    bounds the norms of all iterated Frechet derivatives of order at most s,
    |z|^k ||D^k m(z)|| <= B, together with C^s smoothness away from the origin,
    instead of the multi-index seminorm; the two are equivalent up to constants
    depending on d and s. The exponent condition 1/p = sum 1/p_i < 1 is expressed
    with extended-real exponents 1 < p < infinity and 1 < q_i < infinity. Smoothness
    of Omega is stated as smoothness of the homogeneous kernel K away from the
    origin. The principal value T is defined with limUnder, and Auto.main_result
    proves that the limit exists. Auto.main_result additionally states that m is the
    principal-value Fourier symbol of K, through the compensated pairing identity.

