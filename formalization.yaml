status:
  scope: >-
    Auto.main_result_fourier: for d >= 2, 1 < p < infinity and 1 < q_i < infinity
    with sum of 1/q_i equal to 1/p, the twisted Fourier multiplier operator T_m
    satisfies ||T_m(f)||_p <= C B prod_i ||f_i||_{q_i} on Schwartz inputs, for every
    multiplier m satisfying the Mikhlin condition of order 5d+2 with constant B.
    Auto.main_result: for a homogeneous kernel K(y) = |y|^{-d} Omega(y/|y|) that is
    smooth away from the origin with Omega of spherical mean zero, the joint
    spherical principal value (inner radius to 0, outer radius to infinity) of the
    physical-space operator exists pointwise on Schwartz inputs, equals T_m for the
    principal-value Fourier symbol m of K, and satisfies the corresponding L^p bound.
    Both are a priori estimates on Schwartz functions; extension to general L^q
    inputs is not part of the compared statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
